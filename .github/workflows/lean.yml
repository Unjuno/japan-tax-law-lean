name: Lean & Audit verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    name: Build Lean project and check axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: true

      - name: Build explicitly
        run: lake build

      - name: No sorry/admit in adopted proofs
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b' JapanTaxLaw/

      - name: Axioms of key theorems
        run: |
          printf 'import JapanTaxLaw\n#print axioms JapanTaxLaw.residency_spec_sound\n#print axioms JapanTaxLaw.residentClassification\n#print axioms JapanTaxLaw.excludedFromFiction_yes\n#print axioms JapanTaxLaw.corp_classification_always_one\n#print axioms JapanTaxLaw.actor_spec_sound\n#print axioms JapanTaxLaw.actor_spec_complete\n#print axioms JapanTaxLaw.actor_foreign_spec_sound\n#print axioms JapanTaxLaw.actor_foreign_spec_complete\n#print axioms JapanTaxLaw.foreign_judgment_negates_offices\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_excluded_sound\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_excluded_complete\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_consumption_sound\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_consumption_complete\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_ancillary_sound\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_ancillary_complete\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_source_collected_sound\n#print axioms JapanTaxLaw.TaxGeneralSpec.spec_source_collected_complete\n#print axioms JapanTaxLaw.national_iff_not_excluded\n#print axioms JapanTaxLaw.source_collected_national\n#print axioms JapanTaxLaw.taxpayer_spec_sound\n#print axioms JapanTaxLaw.taxpayer_spec_complete\n#print axioms JapanTaxLaw.source_collection_sufficient\n#print axioms JapanTaxLaw.TaxProcedureSpec.spec_sound
#print axioms JapanTaxLaw.TaxProcedureSpec.spec_complete
#print axioms JapanTaxLaw.CompulsoryRealizationProcedure.all_nodup
#print axioms JapanTaxLaw.CompulsoryRealizationProcedure.all_length
#print axioms JapanTaxLaw.priority_spec_sound\n#print axioms JapanTaxLaw.priority_spec_complete_applyOtherLaw\n#print axioms JapanTaxLaw.priority_spec_complete_applyThisAct\n#print axioms JapanTaxLaw.accelerated_request_excludes
#print axioms JapanTaxLaw.extended_payment_excludes
#print axioms JapanTaxLaw.none_excluded_statutory
#print axioms JapanTaxLaw.StatutoryDeadlineSpec.spec_excluded_sound
#print axioms JapanTaxLaw.StatutoryDeadlineSpec.spec_excluded_complete
#print axioms JapanTaxLaw.StatutoryDeadlineSpec.spec_excluded_imp_not_statutory
#print axioms JapanTaxLaw.TaxationPeriodSpec.spec_sound
#print axioms JapanTaxLaw.TaxationPeriodSpec.spec_complete_art19
#print axioms JapanTaxLaw.TaxationPeriodSpec.spec_complete_general
#print axioms JapanTaxLaw.consumption_qualified_art19
#print axioms JapanTaxLaw.apply_this_act_iff\n' > _ax.lean
          lake env lean _ax.lean > _ax.log 2>&1 || { cat _ax.log; exit 1; }
          cat _ax.log
          ! grep -q 'sorryAx' _ax.log
          ! grep -q 'Classical.choice' _ax.log || { echo "unexpected axioms: $(cat _ax.log)"; exit 1; }

      - name: Reproducibility check 1 (clean build)
        run: |
          lake clean
          lake build
          echo "reproducibility run 1 passed"

      - name: Reproducibility check 2 (clean build)
        run: |
          lake clean
          lake build
          echo "reproducibility run 2 passed"

  python-audit:
    name: Structural audit and mutation injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural audit tests
        run: python -m unittest scripts.tests.test_structural_audit -v
      - name: Mutation injection tests
        run: python -m unittest scripts.tests.test_mutation_injection -v
      - name: Inventory selection tests
        run: python -m unittest scripts.tests.test_inventory_selection -v
      - name: Phase A inventory integrity
        run: python scripts/law_audit/inventory/validate_inventory.py
      - name: Run audit and verify hashes
        run: |
          python -m scripts.law_audit.audit --out build
          python -m scripts.law_audit.report
