name: Lean & Audit verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    name: Build Lean project and check axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: true

      - name: Build explicitly
        run: lake build

      - name: No sorry/admit in adopted proofs
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b' JapanTaxLaw/

      - name: Axioms of key theorems
        run: |
          {
            echo 'import JapanTaxLaw'
            echo '#print axioms JapanTaxLaw.residency_spec_sound'
            echo '#print axioms JapanTaxLaw.residentClassification'
            echo '#print axioms JapanTaxLaw.excludedFromFiction_yes'
            echo '#print axioms JapanTaxLaw.corp_classification_always_one'
            echo '#print axioms JapanTaxLaw.actor_spec_sound'
            echo '#print axioms JapanTaxLaw.actor_spec_complete'
            echo '#print axioms JapanTaxLaw.actor_foreign_spec_sound'
            echo '#print axioms JapanTaxLaw.actor_foreign_spec_complete'
            echo '#print axioms JapanTaxLaw.foreign_judgment_negates_offices'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_excluded_sound'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_excluded_complete'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_consumption_sound'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_consumption_complete'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_ancillary_sound'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_ancillary_complete'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_source_collected_sound'
            echo '#print axioms JapanTaxLaw.TaxGeneralSpec.spec_source_collected_complete'
            echo '#print axioms JapanTaxLaw.national_iff_not_excluded'
            echo '#print axioms JapanTaxLaw.source_collected_national'
            echo '#print axioms JapanTaxLaw.taxpayer_spec_sound'
            echo '#print axioms JapanTaxLaw.taxpayer_spec_complete'
            echo '#print axioms JapanTaxLaw.source_collection_sufficient'
            echo '#print axioms JapanTaxLaw.TaxProcedureSpec.spec_sound'
            echo '#print axioms JapanTaxLaw.TaxProcedureSpec.spec_complete'
            echo '#print axioms JapanTaxLaw.CompulsoryRealizationProcedure.all_nodup'
            echo '#print axioms JapanTaxLaw.CompulsoryRealizationProcedure.all_length'
            echo '#print axioms JapanTaxLaw.priority_spec_sound'
            echo '#print axioms JapanTaxLaw.priority_spec_complete_applyOtherLaw'
            echo '#print axioms JapanTaxLaw.priority_spec_complete_applyThisAct'
            echo '#print axioms JapanTaxLaw.accelerated_request_excludes'
            echo '#print axioms JapanTaxLaw.extended_payment_excludes'
            echo '#print axioms JapanTaxLaw.none_excluded_statutory'
            echo '#print axioms JapanTaxLaw.StatutoryDeadlineSpec.spec_excluded_sound'
            echo '#print axioms JapanTaxLaw.StatutoryDeadlineSpec.spec_excluded_complete'
            echo '#print axioms JapanTaxLaw.StatutoryDeadlineSpec.spec_excluded_imp_not_statutory'
            echo '#print axioms JapanTaxLaw.TaxationPeriodSpec.spec_sound'
            echo '#print axioms JapanTaxLaw.TaxationPeriodSpec.spec_complete_art19'
            echo '#print axioms JapanTaxLaw.TaxationPeriodSpec.spec_complete_general'
            echo '#print axioms JapanTaxLaw.consumption_qualified_art19'
            echo '#print axioms JapanTaxLaw.apply_this_act_iff'
            echo '#print axioms JapanTaxLaw.isBusinessOperatorVerdict_eq_or'
            echo '#print axioms JapanTaxLaw.individual_business_operator_sufficient'
            echo '#print axioms JapanTaxLaw.corporation_sufficient'
            echo '#print axioms JapanTaxLaw.personless_entity_not_sufficient'
            echo '#print axioms JapanTaxLaw.business_operator_no_event_no_obligation'
            echo '#print axioms JapanTaxLaw.not_business_operator_no_obligation'
            echo '#print axioms JapanTaxLaw.owes_iff_business_operator_and_event'
            echo '#print axioms JapanTaxLaw.consumption_tax_classification_always_one'
            echo '#print axioms JapanTaxLaw.spec_business_operator_sound'
            echo '#print axioms JapanTaxLaw.spec_event_sound'
            echo '#print axioms JapanTaxLaw.spec_business_operator_complete'
            echo '#print axioms JapanTaxLaw.spec_event_complete'
            echo '#print axioms JapanTaxLaw.spec_obligation_sound'
            echo '#print axioms JapanTaxLaw.spec_obligation_complete'
            echo '#print axioms JapanTaxLaw.mayLevyUnevenForBenefit'
            echo '#print axioms JapanTaxLaw.mayLevyOnPartOnlyForBenefit'
            echo '#print axioms JapanTaxLaw.local_entity_benefit_sufficient'
            echo '#print axioms JapanTaxLaw.both_privilege_yes'
            echo '#print axioms JapanTaxLaw.privilege_classification_always_one'
            echo '#print axioms JapanTaxLaw.conflict_local_entity_inconsistent'
            echo '#print axioms JapanTaxLaw.conflict_benefit_inconsistent'
            echo '#print axioms JapanTaxLaw.spec_local_privilege_sound'
            echo '#print axioms JapanTaxLaw.spec_local_privilege_complete_mayLevyUneven'
            echo '#print axioms JapanTaxLaw.spec_local_privilege_complete_mayLevyOnPart'
            echo '#print axioms JapanTaxLaw.spec_local_tax_exemption_sound'
            echo '#print axioms JapanTaxLaw.spec_local_tax_exemption_complete'
            echo '#print axioms JapanTaxLaw.spec_local_tax_exemption_complete_sec2'
            echo '#print axioms JapanTaxLaw.mayNotLevy'
            echo '#print axioms JapanTaxLaw.mayLevyUnevenly'
            echo '#print axioms JapanTaxLaw.local_tax_exemption_classification_always_one'
            echo '#print axioms JapanTaxLaw.both_permissions_unique'
            echo '#print axioms JapanTaxLaw.inheritance_tax_classification_always_one'
            echo '#print axioms JapanTaxLaw.inheritance_plus_bequest_with_resident_implies_owes'
            echo '#print axioms JapanTaxLaw.any_no_verdict_gives_no_obligation'
            echo '#print axioms JapanTaxLaw.owes_iff_all_verdicts_yes'
            echo '#print axioms JapanTaxLaw.isResidentCompliantIndividual_eq_and'
            echo '#print axioms JapanTaxLaw.spec_inheritance_act_acquisition_sound'
            echo '#print axioms JapanTaxLaw.spec_inheritance_act_acquisition_complete'
            echo '#print axioms JapanTaxLaw.establishmentEvent'
            echo '#print axioms JapanTaxLaw.under_and_non_declaration_filing_deadline'
            echo '#print axioms JapanTaxLaw.non_payment_payment_deadline'
            echo '#print axioms JapanTaxLaw.withholding_income_payment'
            echo '#print axioms JapanTaxLaw.ObligationArt15Spec.spec_sound'
            echo '#print axioms JapanTaxLaw.ObligationArt15Spec.spec_complete_incomePayment'
            echo '#print axioms JapanTaxLaw.ObligationArt15Spec.spec_complete_supplyOrRemoval'
            echo '#print axioms JapanTaxLaw.ObligationArt15Spec.spec_complete_filingDeadlineExpiry'
            echo '#print axioms JapanTaxLaw.ObligationArt15Spec.spec_complete_paymentDeadlineExpiry'
            echo '#print axioms JapanTaxLaw.ObligationArt15Spec.spec_complete_noProcedure'
            echo '#print axioms JapanTaxLaw.LocalObligorSpec.spec_local_obligor_sound'
            echo '#print axioms JapanTaxLaw.LocalObligorSpec.spec_equal_and_income_complete'
            echo '#print axioms JapanTaxLaw.LocalObligorSpec.spec_equal_only_complete'
            echo '#print axioms JapanTaxLaw.LocalObligorSpec.spec_equal_plus_corporate_complete'
            echo '#print axioms JapanTaxLaw.LocalObligorSpec.spec_corporate_only_complete'
            echo '#print axioms JapanTaxLaw.LocalObligorSpec.spec_equal_only_dormitory_sound'
            echo '#print axioms JapanTaxLaw.only_item1_gives_equal_and_income'
            echo '#print axioms JapanTaxLaw.dormitory_established_equal_only'
            echo '#print axioms JapanTaxLaw.individual_office_no_address_no_track'
            echo '#print axioms JapanTaxLaw.corporation_established_equal_and_corporate'
            echo '#print axioms JapanTaxLaw.trust_established_corporate_only'
            echo '#print axioms JapanTaxLaw.office_individual_established_equal_only'
          } > _ax.lean
          lake env lean _ax.lean > _ax.log 2>&1 || { cat _ax.log; exit 1; }
          cat _ax.log
          ! grep -q 'sorryAx' _ax.log
          ! grep -q 'Classical.choice' _ax.log || { echo "unexpected axioms: $(cat _ax.log)"; exit 1; }

      - name: Reproducibility check 1 (clean build)
        run: |
          lake clean
          lake build
          echo "reproducibility run 1 passed"

      - name: Reproducibility check 2 (clean build)
        run: |
          lake clean
          lake build
          echo "reproducibility run 2 passed"

  python-audit:
    name: Structural audit and mutation injection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural audit tests
        run: python -m unittest scripts.tests.test_structural_audit -v
      - name: Mutation injection tests
        run: python -m unittest scripts.tests.test_mutation_injection -v
      - name: Inventory selection tests
        run: python -m unittest scripts.tests.test_inventory_selection -v
      - name: Cross-law consistency tests
        run: python -m unittest scripts.tests.test_cross_law -v
      - name: Revision impact tests
        run: python -m unittest scripts.tests.test_revision_impact -v
      - name: Phase A inventory integrity
        run: python scripts/law_audit/inventory/validate_inventory.py
      - name: Phase E cross-law pin consistency
        run: python scripts/law_audit/phase_e/cross_law.py
      - name: Phase F revision impact integrity
        run: python scripts/law_audit/phase_f/revision_impact.py
      - name: Run audit and verify hashes
        run: |
          python -m scripts.law_audit.audit --out build
          python -m scripts.law_audit.report
